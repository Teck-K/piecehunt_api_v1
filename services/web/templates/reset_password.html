<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — PieceHunt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .card {
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
        }

        .icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #555555;
            text-align: center;
            margin-bottom: 1.75rem;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: #333333;
            margin-bottom: 0.35rem;
        }

        input[type="password"] {
            width: 100%;
            padding: 0.6rem 0.75rem;
            font-size: 0.95rem;
            border: 1px solid #cccccc;
            border-radius: 6px;
            margin-bottom: 1rem;
            outline: none;
            transition: border-color 0.15s;
        }

        input[type="password"]:focus {
            border-color: #e3000f;
        }

        button {
            width: 100%;
            padding: 0.7rem;
            background-color: #e3000f;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s;
        }

        button:hover {
            background-color: #b8000c;
        }

        .error-msg {
            font-size: 0.85rem;
            color: #c0392b;
            margin-top: 0.75rem;
            text-align: center;
        }

        .card.error h1,
        .card.success h1 {
            text-align: center;
        }

        .card.error p,
        .card.success p {
            font-size: 0.95rem;
            color: #555555;
            text-align: center;
            line-height: 1.5;
        }

        .card.error .icon,
        .card.success .icon {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="card {card_class}">
        {content}
    </div>
</body>

</html>
