<!DOCTYPE html>
<html>

<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <img src="cid:logo" alt="Piecehunt" style="max-width: 150px; margin-bottom: 20px;">
    <h2>Missing Parts Report</h2>
    <p>Hi {username},</p>
    <p>Please find attached your Missing Parts Report.</p>
    <table style="width: 100%; border-collapse: collapse; margin: 16px 0;">
        <tr style="background-color: #f5f5f5;">
            <td style="padding: 8px 12px; font-size: 13px; color: #555;">Unique missing parts</td>
            <td style="padding: 8px 12px; font-size: 13px; font-weight: bold; color: #1a1a2e;">{part_count}</td>
        </tr>
        <tr>
            <td style="padding: 8px 12px; font-size: 13px; color: #555;">Sets included</td>
            <td style="padding: 8px 12px; font-size: 13px; font-weight: bold; color: #1a1a2e;">{set_count}</td>
        </tr>
        <tr style="background-color: #f5f5f5;">
            <td style="padding: 8px 12px; font-size: 13px; color: #555;">Spare parts</td>
            <td style="padding: 8px 12px; font-size: 13px; font-weight: bold; color: #1a1a2e;">{spares_note}</td>
        </tr>
    </table>
    <p>Time to hunt for those missing pieces!</p>
    <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="color: #aaa; font-size: 12px;">This is an automated message. Please do not reply to this email.</p>
</body>

</html>
