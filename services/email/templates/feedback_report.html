<!DOCTYPE html>
<html lang="en">

<body
    style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #18181b;">

    <div
        style="max-width: 560px; margin: 40px auto; background: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08);">

        <div style="background-color: #18181b; padding: 24px 32px;">
            <img src="cid:logo" alt="PieceHunt" style="height: 32px; width: auto;" />
        </div>

        <div style="padding: 24px 32px 32px;">
            <span
                style="display: inline-block; margin-bottom: 16px; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; background-color: #fef3c7; color: #92400e;">{feedback_type}</span>

            <table style="width: 100%; border-collapse: collapse; margin-bottom: 24px;">
                <tr>
                    <td
                        style="padding: 10px 0; border-bottom: 1px solid #f4f4f5; font-size: 14px; vertical-align: top; color: #71717a; width: 110px; font-weight: 500;">
                        User</td>
                    <td
                        style="padding: 10px 0; border-bottom: 1px solid #f4f4f5; font-size: 14px; vertical-align: top;">
                        {user_email}</td>
                </tr>
                <tr>
                    <td
                        style="padding: 10px 0; border-bottom: 1px solid #f4f4f5; font-size: 14px; vertical-align: top; color: #71717a; width: 110px; font-weight: 500;">
                        Log attached</td>
                    <td
                        style="padding: 10px 0; border-bottom: 1px solid #f4f4f5; font-size: 14px; vertical-align: top;">
                        {logs_attached}</td>
                </tr>
            </table>

            <div
                style="background: #f4f4f5; border-radius: 6px; padding: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap;">
                {description}</div>
        </div>

        <div
            style="padding: 20px 32px; border-top: 1px solid #f4f4f5; font-size: 12px; color: #a1a1aa; text-align: center;">
            Automatically sent from the PieceHunt app · <a href="https://piecehunt.app"
                style="color:#a1a1aa;">piecehunt.app</a>
        </div>

    </div>

</body>

</html>
